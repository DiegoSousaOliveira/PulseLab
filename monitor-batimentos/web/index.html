<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de Batimentos</title>
<style>
/* Projeto educacional: NÃO é aparelho médico.
   Os dados chegam da placa por Bluetooth. A página não carrega nada da
   internet (nem fontes): funciona offline e nenhum dado sai deste computador. */
:root{
  --fundo:#0F172A; --cartao:#1E293B; --texto:#F1F5F9; --texto2:#94A3B8;
  --bpm:#F43F5E; --spo2:#38BDF8; --linha:#334155; --raio:16px;
  --fonte:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{background:var(--fundo);color:var(--texto);font-family:var(--fonte)}
body{min-height:100vh;padding:clamp(12px,2.5vw,32px);display:flex;flex-direction:column;gap:clamp(12px,1.8vw,24px)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(1.1rem,2.2vw,2rem);font-weight:700;display:flex;align-items:center;gap:.5em}
h1 svg{width:1.2em;height:1.2em;fill:var(--bpm)}
.pilula{font-size:clamp(.85rem,1.4vw,1.25rem);padding:.4em .9em;border-radius:999px;background:var(--cartao);color:var(--texto2);display:flex;align-items:center;gap:.5em}
.pilula::before{content:"";width:.6em;height:.6em;border-radius:50%;background:currentColor}
.pilula.ok{color:#4ADE80}.pilula.medindo{color:#FBBF24}.pilula.erro{color:var(--bpm)}
.acoes{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.botao{font:inherit;font-size:clamp(.85rem,1.4vw,1.15rem);font-weight:700;padding:.5em 1.1em;border:0;border-radius:999px;background:var(--bpm);color:#fff;cursor:pointer}
.botao:hover{filter:brightness(1.1)}.botao:focus-visible{outline:3px solid var(--spo2);outline-offset:2px}
.botao[hidden]{display:none}
main{display:grid;grid-template-columns:2fr 1fr;grid-template-rows:auto 1fr;gap:clamp(12px,1.8vw,24px);flex:1;min-height:0}
.cartao{background:var(--cartao);border-radius:var(--raio);padding:clamp(16px,2.2vw,32px);display:flex;flex-direction:column;gap:.5em;min-width:0}
.rotulo{color:var(--texto2);font-size:clamp(.9rem,1.5vw,1.4rem);display:flex;align-items:center;gap:.5em}
.valor{display:flex;align-items:baseline;gap:.15em;font-variant-numeric:tabular-nums;line-height:1;font-weight:700}
#bpm-valor{font-size:clamp(4rem,min(15vw,21vh),13rem);color:var(--bpm)}
#spo2-valor{font-size:clamp(3rem,min(8vw,13vh),7rem);color:var(--spo2)}
.unidade{font-size:clamp(1rem,2vw,2rem);color:var(--texto2);font-weight:500}
.linha-bpm{display:flex;align-items:center;gap:clamp(12px,3vw,40px)}
#coracao{width:clamp(56px,min(9vw,14vh),140px);height:auto;fill:var(--bpm);transition:transform .12s ease-out;filter:drop-shadow(0 0 0 transparent)}
#coracao.bate{transform:scale(1.18);filter:drop-shadow(0 0 18px rgba(244,63,94,.6))}
.faixa{align-self:flex-start;font-size:clamp(.8rem,1.3vw,1.1rem);padding:.3em .8em;border-radius:999px;background:#0F172A;color:var(--texto2)}
.progresso{height:6px;border-radius:3px;background:var(--linha);overflow:hidden}
.progresso div{height:100%;width:0;background:var(--bpm);transition:width .3s}
.nota{color:var(--texto2);font-size:clamp(.75rem,1.1vw,.95rem)}
.gota{width:1em;height:1em;fill:var(--spo2)}
/* O canvas fica "solto" (absolute) dentro da moldura: se ele participasse do
   layout, cada redimensionamento o faria crescer um pouco mais, sem parar. */
.onda{grid-column:1/-1;grid-row:2;min-height:150px}
main.com-desafio{grid-template-rows:auto auto 1fr}main.com-desafio .onda{grid-row:3}
.moldura{position:relative;flex:1;min-height:100px}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#desafio{grid-column:1/-1;grid-row:2;display:none}
#desafio.ativo{display:flex}
.desafio-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:.4em}
.desafio-grade div{background:var(--fundo);border-radius:12px;padding:.7em 1em}
.desafio-grade b{display:block;font-size:clamp(1.4rem,3vw,2.6rem);font-variant-numeric:tabular-nums}
.desafio-grade span{color:var(--texto2);font-size:.9rem}
#desafio-fase{font-size:clamp(1.1rem,2.2vw,1.9rem);font-weight:700}
footer{background:var(--cartao);border-radius:var(--raio);padding:12px 18px;color:var(--texto2);font-size:clamp(.8rem,1.2vw,1.05rem);display:flex;gap:.6em;align-items:center}
footer strong{color:var(--texto)}
@media (min-width:721px) and (min-height:560px){body{height:100vh}}
@media (max-width:720px){main,main.com-desafio{grid-template-columns:1fr;grid-template-rows:none;align-content:start}#desafio,.onda,main.com-desafio .onda{grid-row:auto}.onda{min-height:200px}}
@media (prefers-reduced-motion:reduce){#coracao{transition:none}}
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.6 2.1 4.5 6 4.1c2.3-.2 4.4 1.1 6 3.1 1.6-2 3.7-3.3 6-3.1 3.9.4 5.6 4.5 4 7.6C19.5 16.4 12 21 12 21z"/></svg>Monitor de Batimentos</h1>
  <div class="acoes">
    <div id="estado" class="pilula" role="status" aria-live="polite">Carregando…</div>
    <button id="conectar" class="botao" type="button">Conectar à placa</button>
  </div>
</header>

<main>
  <section class="cartao" aria-label="Batimentos por minuto">
    <div class="rotulo">Batimentos por minuto</div>
    <div class="linha-bpm">
      <svg id="coracao" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-10-9.3C.4 8.6 2.1 4.5 6 4.1c2.3-.2 4.4 1.1 6 3.1 1.6-2 3.7-3.3 6-3.1 3.9.4 5.6 4.5 4 7.6C19.5 16.4 12 21 12 21z"/></svg>
      <div class="valor"><span id="bpm-valor">--</span><span class="unidade">BPM</span></div>
    </div>
    <div class="faixa" id="faixa">aguardando leitura</div>
    <div class="progresso" id="progresso" aria-hidden="true"><div></div></div>
  </section>

  <section class="cartao" aria-label="Oxigenação">
    <div class="rotulo"><svg class="gota" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2s7 7.6 7 12.5A7 7 0 0 1 5 14.5C5 9.6 12 2 12 2z"/></svg>Oxigenação (SpO2)</div>
    <div class="valor"><span id="spo2-valor">--</span><span class="unidade">%</span></div>
    <p class="nota" id="spo2-nota"></p>
  </section>

  <section class="cartao" id="desafio" aria-label="Desafio do Pátio">
    <div class="rotulo">Desafio do Pátio</div>
    <div id="desafio-fase">—</div>
    <div class="desafio-grade" id="desafio-grade"></div>
  </section>

  <section class="cartao onda" aria-label="Onda do pulso">
    <div class="rotulo">Onda do pulso (PPG)</div>
    <div class="moldura"><canvas id="grafico" aria-hidden="true"></canvas></div>
  </section>
</main>

<footer><span aria-hidden="true">⚠️</span><span><strong>Projeto educacional: não é aparelho médico.</strong> Os dados vêm da placa por Bluetooth, ficam só nesta página e nada é enviado para a internet.</span></footer>

<script>
// ---------------------------------------------------------------------------
// Recebe as leituras da placa por BLUETOOTH (Web Bluetooth: Chrome ou Edge,
// no computador ou no Android) e desenha o painel.
// Abra este arquivo direto no navegador (duplo clique) e clique em "Conectar".
// Modo demonstração, sem placa: index.html?demo
//
// Os UUIDs e o formato dos pacotes são os mesmos de lib/painel_ble.py.
// ---------------------------------------------------------------------------
const UUID_SERVICO = "448e804d-b3e1-4c80-89f5-91c53751f51a";
const UUID_ESTADO  = "114b64c2-3004-4c6f-8311-1dbaa117286e";
const UUID_ONDA    = "ab2cad3c-87af-494c-9f9f-62b21297da07";
const PONTOS_ONDA = 128;             // ~5 s de onda na tela
const SEM_VALOR = 0xFFFF;
const ESTADOS = ["sem_sensor","sem_dedo","estabilizando","pronto"];
const FASES = [null,"repouso_espera","repouso","exercicio","volta","recuperacao","resultado"];
const FAIXAS = [[60,"abaixo de 60"],[101,"entre 60 e 100"],[141,"entre 100 e 140"],[1e9,"acima de 140"]];

const $ = id => document.getElementById(id);
let ultimasBatidas = null, ultimaOnda = [], dispositivo = null, ultimoPacote = 0, querConectado = false;

function texto(id, t){ const e=$(id); if(e.textContent!==String(t)) e.textContent=t; }
function tempo(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function pilula(t, classe){ const e=$("estado"); e.textContent=t; e.className="pilula "+(classe||""); }

// ---- Pacote ESTADO (16 bytes, little-endian) -------------------------------
function lerEstado(dv){
  const fase = FASES[dv.getUint8(7)] || null;
  const tempoS = dv.getUint16(11, true) / 10;
  const rec = dv.getUint16(13, true);
  const flags = dv.getUint8(2);
  return {
    estado: ESTADOS[dv.getUint8(1)] || "sem_dedo",
    estavel: !!(flags & 1), spo2_presumido: !!(flags & 2), som: !!(flags & 4),
    bpm: dv.getUint8(3), spo2: dv.getUint8(4), progresso: dv.getUint8(5) / 255,
    batidas: dv.getUint8(6),
    desafio: fase && {fase, repouso: dv.getUint8(8), pico: dv.getUint8(9), alvo: dv.getUint8(10),
                      restante: tempoS, tempo: tempoS, recuperacao: rec === SEM_VALOR ? null : rec / 10},
  };
}

// ---- Pacote ONDA: sequência, n, n pontos int16 ------------------------------
function lerOnda(dv){
  const n = dv.getUint8(1);
  for(let i=0;i<n;i++) ultimaOnda.push(dv.getInt16(2 + 2*i, true));
  if(ultimaOnda.length > PONTOS_ONDA) ultimaOnda.splice(0, ultimaOnda.length - PONTOS_ONDA);
  onda();
}

function mostrarEstado(d){
  const mapa={sem_sensor:["Sensor não encontrado","erro"],sem_dedo:["Coloque o dedo no sensor",""],
              estabilizando:["Medindo…","medindo"],pronto:[d.estavel?"Leitura estável":"Medindo…",d.estavel?"ok":"medindo"]};
  const [t,c]=mapa[d.estado]||["—",""];
  pilula(t, c);
}

function faixa(bpm){
  if(!bpm) return "aguardando leitura";
  for(const [lim,t] of FAIXAS) if(bpm<lim) return "faixa: "+t;
}

function desafio(d){
  const c=$("desafio");
  document.querySelector("main").classList.toggle("com-desafio",!!d);
  if(!d){ c.classList.remove("ativo"); return; }
  c.classList.add("ativo");
  const nomes={repouso_espera:"1/3 · Repouso: coloque o dedo e fique parado",repouso:"1/3 · Medindo o repouso",
    exercicio:"2/3 · Tire o dedo e PULE!",volta:"3/3 · Coloque o dedo de novo",
    recuperacao:"3/3 · Recuperação: voltando ao repouso",resultado:"Resultado"};
  texto("desafio-fase",nomes[d.fase]||d.fase);
  const itens=[];
  if(d.fase==="repouso"||d.fase==="exercicio") itens.push([Math.ceil(d.restante)+" s","faltam"]);
  if(d.repouso) itens.push([d.repouso+" BPM","repouso"]);
  if(d.pico) itens.push([d.pico+" BPM","pico"]);
  if(d.repouso&&d.pico) itens.push([(d.pico-d.repouso>=0?"+":"")+(d.pico-d.repouso)+" BPM","aumento"]);
  if(d.fase==="recuperacao") itens.push(["≤ "+d.alvo+" BPM","alvo"]);
  if(d.fase==="volta"||d.fase==="recuperacao") itens.push([tempo(d.tempo),"desde o exercício"]);
  if(d.fase==="resultado") itens.push([d.recuperacao==null?"> 3:00":tempo(d.recuperacao),"recuperação"]);
  $("desafio-grade").innerHTML=itens.map(([v,r])=>"<div><b>"+v+"</b><span>"+r+"</span></div>").join("");
}

function onda(){
  const pontos=ultimaOnda;
  const cv=$("grafico"), dpr=window.devicePixelRatio||1;
  const w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);}
  const g=cv.getContext("2d"); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,w,h);
  g.strokeStyle="#334155"; g.lineWidth=1; g.beginPath(); g.moveTo(0,h/2); g.lineTo(w,h/2); g.stroke();
  if(pontos.length<2) return;
  let min=Math.min(...pontos), max=Math.max(...pontos); if(max-min<1){max+=1;min-=1;}
  const m=h*0.1, passo=w/(PONTOS_ONDA-1), x0=w-(pontos.length-1)*passo;   // entra pela direita
  g.strokeStyle="#F43F5E"; g.lineWidth=Math.max(2,w/400); g.lineJoin="round";
  g.shadowColor="rgba(244,63,94,.5)"; g.shadowBlur=8; g.beginPath();
  pontos.forEach((v,i)=>{const x=x0+i*passo, y=h-m-(v-min)*(h-2*m)/(max-min); i?g.lineTo(x,y):g.moveTo(x,y);});
  g.stroke(); g.shadowBlur=0;
}

function aplicar(d){
  ultimoPacote = Date.now();
  mostrarEstado(d);
  texto("bpm-valor", d.bpm||"--");
  texto("spo2-valor", d.spo2||"--");
  texto("faixa", faixa(d.bpm));
  texto("spo2-nota", d.spo2_presumido?"* Calibração presumida: o valor serve só para estudar o princípio de funcionamento.":"Valor aproximado (fórmula empírica).");
  const p=$("progresso"); p.style.visibility=(d.estado!=="sem_dedo"&&!d.estavel)?"visible":"hidden";
  p.firstElementChild.style.width=Math.round((d.progresso||0)*100)+"%";
  // O contador de batidas vai de 0 a 255 e dá a volta: qualquer mudança = batida nova.
  if(ultimasBatidas!==null && d.batidas!==ultimasBatidas){
    const c=$("coracao"); c.classList.remove("bate"); void c.offsetWidth; c.classList.add("bate");
    setTimeout(()=>c.classList.remove("bate"),180);
  }
  ultimasBatidas=d.batidas;
  desafio(d.desafio);
}

// ---- Conexão Bluetooth -----------------------------------------------------
function botao(t, visivel){ const b=$("conectar"); b.textContent=t; b.hidden=!visivel; }

async function ligarGatt(){
  pilula("Conectando a "+(dispositivo.name||"placa")+"…","medindo");
  const gatt = await dispositivo.gatt.connect();
  const servico = await gatt.getPrimaryService(UUID_SERVICO);
  const cEstado = await servico.getCharacteristic(UUID_ESTADO);
  const cOnda = await servico.getCharacteristic(UUID_ONDA);
  cEstado.addEventListener("characteristicvaluechanged", e => aplicar(lerEstado(e.target.value)));
  cOnda.addEventListener("characteristicvaluechanged", e => lerOnda(e.target.value));
  await cEstado.startNotifications();
  await cOnda.startNotifications();
  aplicar(lerEstado(await cEstado.readValue()));      // mostra já o último estado
  botao("Desconectar", true);
}

async function conectar(){
  if(dispositivo && dispositivo.gatt.connected){        // botão vira "Desconectar"
    querConectado=false; dispositivo.gatt.disconnect(); return;
  }
  try{
    if(!dispositivo){
      dispositivo = await navigator.bluetooth.requestDevice({
        filters:[{services:[UUID_SERVICO]},{namePrefix:"Batimentos"}],
        optionalServices:[UUID_SERVICO]});
      dispositivo.addEventListener("gattserverdisconnected", desconectou);
    }
    querConectado=true;
    await ligarGatt();
  }catch(e){
    pilula(e.name==="NotFoundError"?"Nenhuma placa escolhida":"Erro: "+e.message,"erro");
    botao("Conectar à placa", true);
  }
}

async function desconectou(){
  ultimasBatidas=null;
  if(!querConectado){ pilula("Desconectado",""); botao("Conectar à placa", true); return; }
  // Caiu sozinho (placa reiniciou, ficou longe...): tenta voltar algumas vezes.
  for(let i=1;i<=5 && querConectado;i++){
    pilula("Reconectando ("+i+"/5)…","medindo"); botao("Conectar à placa", false);
    await new Promise(r=>setTimeout(r,1500));
    try{ await ligarGatt(); return; }catch(e){}
  }
  pilula("Conexão perdida","erro"); botao("Conectar à placa", true);
}

// Sem pacotes há mais de 3 s com a conexão aberta? Avisa (a placa reenvia a cada 1 s).
setInterval(()=>{
  if(dispositivo && dispositivo.gatt.connected && Date.now()-ultimoPacote>3000) pilula("Sem dados da placa","erro");
},1000);

// ---- Modo demonstração (sem placa): index.html?demo -------------------------
function demonstracao(){
  pilula("Modo demonstração","medindo"); botao("", false);
  let t=0, batidas=0, proxima=0;
  setInterval(()=>{
    t+=0.1;
    const bpm=72+Math.round(4*Math.sin(t/7));
    if(t>=proxima){ batidas=(batidas+1)&255; proxima=t+60/bpm; }
    for(let k=0;k<3;k++){                       // ~26 pontos/s, como a placa
      const f=((t+k*0.033)*bpm/60)%1;
      ultimaOnda.push(Math.round(400*Math.exp(-(((f-0.2)/0.07)**2))+140*Math.exp(-(((f-0.5)/0.1)**2))));
    }
    if(ultimaOnda.length>PONTOS_ONDA) ultimaOnda.splice(0,ultimaOnda.length-PONTOS_ONDA);
    onda();
    aplicar({estado:"pronto",estavel:t>6,spo2_presumido:true,som:true,bpm:t>4?bpm:0,spo2:t>6?97:0,
             progresso:Math.min(1,t/6),batidas,desafio:null});
    pilula("Modo demonstração","medindo");
  },100);
}

window.addEventListener("resize", onda);
if(location.search.includes("demo")) demonstracao();
else if(!navigator.bluetooth){
  pilula("Este navegador não tem Web Bluetooth: use Chrome ou Edge (computador ou Android)","erro");
  botao("", false);
} else {
  pilula("Clique em “Conectar à placa”","");
  $("conectar").addEventListener("click", conectar);
}
</script>
</body>
</html>
